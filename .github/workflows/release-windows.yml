name: Release Windows

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DevGuard.csproj

      - name: Publish Windows x64
        run: >
          dotnet publish DevGuard.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/win-x64

      - name: Create ZIP
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"

          Compress-Archive `
            -Path "publish/win-x64/*" `
            -DestinationPath "DevGuard-$version-win-x64.zip"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "DevGuard-${{ github.ref_name }}-win-x64.zip" `
            --title "DevGuard ${{ github.ref_name }}" `
            --generate-notes